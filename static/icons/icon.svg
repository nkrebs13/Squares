<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Dark navy gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744"/>
      <stop offset="100%" style="stop-color:#0f1829"/>
    </linearGradient>
    <!-- Copper/bronze football gradient -->
    <linearGradient id="footballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4956a"/>
      <stop offset="50%" style="stop-color:#b8733d"/>
      <stop offset="100%" style="stop-color:#8b5a2b"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="18" fill="url(#bgGrad)"/>

  <!-- American football - rotated 45 degrees -->
  <g transform="translate(50,50) rotate(-35)">
    <!-- Football body -->
    <ellipse cx="0" cy="0" rx="32" ry="18" fill="url(#footballGrad)"/>

    <!-- Seam lines -->
    <path d="M -32 0 Q 0 -8 32 0" stroke="#1a2744" stroke-width="1.5" fill="none"/>
    <path d="M -32 0 Q 0 8 32 0" stroke="#1a2744" stroke-width="1.5" fill="none"/>

    <!-- Laces -->
    <rect x="-12" y="-4" width="24" height="8" fill="#1a2744" rx="2"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#d4956a" stroke-width="2"/>
    <line x1="-7" y1="-4" x2="-7" y2="4" stroke="#d4956a" stroke-width="1.5"/>
    <line x1="-3.5" y1="-4" x2="-3.5" y2="4" stroke="#d4956a" stroke-width="1.5"/>
    <line x1="3.5" y1="-4" x2="3.5" y2="4" stroke="#d4956a" stroke-width="1.5"/>
    <line x1="7" y1="-4" x2="7" y2="4" stroke="#d4956a" stroke-width="1.5"/>
  </g>
</svg>
