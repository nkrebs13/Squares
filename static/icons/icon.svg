<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.3">
    <line x1="56" y1="156" x2="456" y2="156"/>
    <line x1="56" y1="256" x2="456" y2="256"/>
    <line x1="56" y1="356" x2="456" y2="356"/>
    <line x1="156" y1="56" x2="156" y2="456"/>
    <line x1="256" y1="56" x2="256" y2="456"/>
    <line x1="356" y1="56" x2="356" y2="456"/>
  </g>
  <!-- Highlighted square (winner) -->
  <rect x="156" y="156" width="100" height="100" fill="#e94560" opacity="0.8" rx="8"/>
  <!-- Team colors top and left -->
  <rect x="56" y="56" width="400" height="50" fill="#E31837" rx="8"/>
  <rect x="56" y="56" width="50" height="400" fill="#004C54" rx="8"/>
  <!-- Corner overlap -->
  <rect x="56" y="56" width="50" height="50" fill="#1a1a2e" rx="8"/>
  <!-- Football icon in center -->
  <ellipse cx="306" cy="306" rx="50" ry="30" fill="#8B4513" transform="rotate(-30 306 306)"/>
  <path d="M 270 306 Q 306 286 342 306" stroke="white" stroke-width="3" fill="none"/>
  <line x1="306" y1="286" x2="306" y2="326" stroke="white" stroke-width="3"/>
</svg>
