version: 2

updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      # Group minor/patch updates to reduce PR noise
      production-deps:
        patterns:
          - '@supabase/*'
          - 'idb-keyval'
        update-types:
          - 'minor'
          - 'patch'
      dev-deps-testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - '@playwright/test'
        update-types:
          - 'minor'
          - 'patch'
      dev-deps-build:
        patterns:
          - 'vite'
          - '@sveltejs/*'
          - 'svelte'
          - 'svelte-check'
          - 'tailwindcss'
          - '@tailwindcss/*'
        update-types:
          - 'minor'
          - 'patch'
      dev-deps-lint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - 'typescript-eslint'
          - 'prettier'
          - 'prettier-*'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions — patch + minor only. Major bumps need manual review
  # because actions are SHA-pinned in ci.yml (security hardening) and a
  # major bump usually changes the action's API surface or required inputs.
  # Dependabot updates the SHA + the trailing version comment automatically.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
