name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  lint-and-check:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (svelte-check)
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-key-for-build-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  integration-tests:
    name: Integration Tests (Supabase)
    runs-on: ubuntu-latest
    needs: [lint-and-check]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for integration tests
        id: check-integration
        run: |
          if ls src/tests/integration/*.test.ts 1>/dev/null 2>&1; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No integration tests found — skipping"
          fi

      - name: Setup Supabase CLI
        if: steps.check-integration.outputs.has_tests == 'true'
        uses: supabase/setup-cli@v1
        with:
          # Pin to v2.44.0: v2.45.5+ removed ANON_KEY from `supabase status` JSON output
          # (supabase/cli#4211). TODO: Unpin once https://github.com/supabase/cli/pull/4320
          # is merged and available in supabase/setup-cli.
          version: 2.44.0

      - name: Start local Supabase
        if: steps.check-integration.outputs.has_tests == 'true'
        run: supabase init || true && supabase start

      - name: Run integration tests
        if: steps.check-integration.outputs.has_tests == 'true'
        run: |
          # Use env output format — designed for scripts, avoids JSON field name drift
          eval "$(supabase status -o env 2>/dev/null)"
          export TEST_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export TEST_SUPABASE_KEY="${ANON_KEY}"

          # Also set VITE_ vars — vitest test.env only applies to test workers,
          # but globalSetup.ts runs in the main process and reads VITE_ directly
          export VITE_SUPABASE_URL="${TEST_SUPABASE_URL}"
          export VITE_SUPABASE_ANON_KEY="${TEST_SUPABASE_KEY}"

          if [ -z "$TEST_SUPABASE_KEY" ] || [ "$TEST_SUPABASE_KEY" = "null" ]; then
            echo "::error::Failed to extract Supabase ANON_KEY"
            echo "--- supabase status ---"
            supabase status
            echo "--- supabase status -o env ---"
            supabase status -o env 2>/dev/null || true
            exit 1
          fi

          npm run test:integration:ci

      - name: Stop local Supabase
        if: steps.check-integration.outputs.has_tests == 'true' && always()
        run: supabase stop

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-check, unit-tests]

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (on cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
