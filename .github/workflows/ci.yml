name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  lint-and-check:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify lockfile integrity
        run: git diff --exit-code package-lock.json

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (svelte-check)
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-key-for-build-check

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          # Fail if any individual JS chunk exceeds 150KB gzipped
          MAX_GZIP_BYTES=153600
          oversized=0
          for f in $(find .svelte-kit/output build -name '*.js' 2>/dev/null); do
            size=$(gzip -c "$f" | wc -c)
            if [ "$size" -gt "$MAX_GZIP_BYTES" ]; then
              echo "::error::Bundle too large: $f ($(( size / 1024 ))KB gzipped, max $(( MAX_GZIP_BYTES / 1024 ))KB)"
              oversized=1
            fi
          done
          if [ "$oversized" -eq 1 ]; then
            exit 1
          fi
          echo "All JS chunks are within the 150KB gzipped budget"

  integration-tests:
    name: Integration Tests (Supabase)
    runs-on: ubuntu-latest
    needs: [lint-and-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for integration tests
        id: check-integration
        run: |
          if ls src/tests/integration/*.test.ts 1>/dev/null 2>&1; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No integration tests found — skipping"
          fi

      - name: Setup Supabase CLI
        if: steps.check-integration.outputs.has_tests == 'true'
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1
        with:
          # Pin to v2.44.0: v2.45.5+ removed ANON_KEY from `supabase status` JSON output
          # (supabase/cli#4211). TODO: Unpin once https://github.com/supabase/cli/pull/4320
          # is merged and available in supabase/setup-cli.
          version: 2.44.0

      - name: Start local Supabase
        if: steps.check-integration.outputs.has_tests == 'true'
        run: |
          supabase init || true
          supabase start

      - name: Verify migrations applied cleanly
        if: steps.check-integration.outputs.has_tests == 'true'
        run: |
          eval "$(supabase status -o env 2>/dev/null)"
          # Reset applies all migrations from scratch — verifies they're idempotent
          supabase db reset
          echo "All migrations applied successfully"

      - name: Run integration tests
        if: steps.check-integration.outputs.has_tests == 'true'
        run: |
          # Use env output format — designed for scripts, avoids JSON field name drift
          eval "$(supabase status -o env 2>/dev/null)"
          export TEST_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export TEST_SUPABASE_KEY="${ANON_KEY}"

          # Also set VITE_ vars — vitest test.env only applies to test workers,
          # but globalSetup.ts runs in the main process and reads VITE_ directly
          export VITE_SUPABASE_URL="${TEST_SUPABASE_URL}"
          export VITE_SUPABASE_ANON_KEY="${TEST_SUPABASE_KEY}"

          if [ -z "$TEST_SUPABASE_KEY" ] || [ "$TEST_SUPABASE_KEY" = "null" ]; then
            echo "::error::Failed to extract Supabase ANON_KEY"
            echo "--- supabase status ---"
            supabase status
            echo "--- supabase status -o env ---"
            supabase status -o env 2>/dev/null || true
            exit 1
          fi

          npm run test:integration:ci

      - name: Stop local Supabase
        if: steps.check-integration.outputs.has_tests == 'true' && always()
        run: supabase stop

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-check, unit-tests]

    env:
      # E2E tests use Playwright route mocking (page.route) to intercept all Supabase
      # API calls — no real Supabase instance is needed. Placeholder values satisfy
      # the Vite build which bakes these into the client bundle.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-key-for-e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (on cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
